services:
  production-app:
    build:
      context: .
    container_name: production-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
