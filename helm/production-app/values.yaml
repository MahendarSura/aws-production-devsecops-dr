replicaCount: 3
image:
  repository: ghcr.io/mahendarsura/aws-production-devsecops-dr
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: production.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  APP_ENV: production
  LOG_LEVEL: info
