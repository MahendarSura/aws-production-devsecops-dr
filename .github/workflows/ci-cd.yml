name: Production DevSecOps Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install flake8 pytest pytest-cov
          if [ -f docker/requirements.txt ]; then pip install -r docker/requirements.txt; fi
      - name: Run Linting
        run: flake8 docker/ --max-line-length=120 || true
      - name: Run Unit Tests
        run: PYTHONPATH=docker pytest tests/ -v

  security-scans:
    name: DevSecOps Vulnerability & IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
      - name: Run Checkov IaC Security
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform,kubernetes
          output_format: cli
          soft_fail: true

  build-and-push:
    name: Container Build & Push
    needs: [lint-and-test, security-scans]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
